tags:
  - Auth
summary: Login user
operationId: loginUser
description: Login user with email and password
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            format: email
            example: johnDoe@mail.com
          password:
            type: string
            format: password
            example: JohnDoe123
responses:
  '200':
    description: Successfully logged in an user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: v4ZILl3+mLqnnwtNqQmpf/Lrey4s+D2DUFBNPcKF

  '401':
    $ref: ../../../components/responses/401.yaml
