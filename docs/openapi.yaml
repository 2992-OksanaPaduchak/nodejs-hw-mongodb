openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    The API provides contact manager functionality with user authentication support.
    Each user can create, edit, and delete their own contacts,
    attach photos, and perform search and filtering.
    Authorization is implemented via Bearer tokens.
tags:
  - name: Contacts
    description: Operations about users.
  - name: Auth
    description: Auth operations.

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-26ee.onrender.com
paths:
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auth/register/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/login/login.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/logout/logout.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/refresh/refresh.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
